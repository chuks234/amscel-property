{% extends "base.html" %}

{% block title %}Contact Us | AMSCEL PROPERTY LIMITED{% endblock %}

{% block content %}

<section class="page-header">
    <div class="container">
        <h1>Contact Us</h1>
        <p>Have a question? Send us a message and our team will get back to you.</p>
    </div>
</section>

<section class="section">

    <div class="form-container">

        <h2>Send Us a Message</h2>

        <form method="post">

            {% csrf_token %}

            <div class="form-group">
                <label for="id_name">Full Name</label>
                <input
                    type="text"
                    name="name"
                    id="id_name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="id_phone">Phone Number</label>
                <input
                    type="text"
                    name="phone"
                    id="id_phone"
                    required
                >
            </div>

            <div class="form-group">
                <label for="id_email">Email Address</label>
                <input
                    type="email"
                    name="email"
                    id="id_email"
                >
            </div>

            <div class="form-group">
                <label for="id_message">Message</label>
                <textarea
                    name="message"
                    id="id_message"
                    rows="6"
                    required
                ></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Send Message
            </button>

        </form>

    </div>

</section>

{% endblock %}
